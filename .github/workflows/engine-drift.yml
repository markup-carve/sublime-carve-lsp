name: Engine drift

# This package does not implement Carve, and does not even talk to the engine
# directly - it launches carve-lsp, which carries the engine. So there are TWO
# pins between a Sublime user and the language, and neither was watched
# (carve#735). `ci.yml` handshakes with the pinned server on every push, which
# proves it starts; a server that starts and is a year old passes that check
# exactly as well as a current one.
#
# The pin here is EXACT (`"@markup-carve/carve-lsp": "0.1.0"`), so nothing
# arrives on its own - not even a patch release. Renovate is configured for it,
# which raises a PR; nothing says how far behind the package is in the meantime,
# or whether the newer server would still work with this client.
#
# FOUR QUESTIONS, deliberately kept apart:
#
#   1. The pinned server against npm's latest, and against the lockfile. Version
#      strings, and the cheap half of the answer.
#
#   2. What engine does the PINNED server carry? carve-lsp declares it in its own
#      package.json, and nothing downstream ever read that back. A recorded
#      dependency nothing reads is a comment, not traceability - the failure
#      mode that let intellij-carve ship a provenance header whose value had
#      silently degraded to the literal `unknown`.
#
#   3. Where is that engine against carve-js `main`? The distance no range check
#      can see, because nothing about the range is wrong - the PUBLISHED engine
#      stopped tracking the source (carve#499).
#
#   4. Does the LATEST server still work with this client? The artifact
#      question, and the only one a version string cannot answer. It is the same
#      handshake ci.yml runs against the pinned server, pointed at the release
#      this package would take next.
#
# 1 to 3 WARN: upstream moving is not a defect here and cannot be fixed here.
# 4 FAILS, because a newer server that does not speak to this client is this
# package's problem - it is what a user gets the moment the pin is bumped, and
# finding out during the bump is finding out too late.

on:
  schedule:
    # 05:00 UTC daily, alongside the other drift runs in the org.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  server-pin:
    name: The pinned server, and the engine it carries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the pinned carve-lsp
        working-directory: language-server
        run: npm install --no-audit --no-fund

      - name: Compare the pinned server against npm
        id: server
        run: |
          set -euo pipefail
          pkg='@markup-carve/carve-lsp'
          declared="$(node -p "const p=require('./language-server/package.json');(p.dependencies||{})['${pkg}']||''")"
          if [ -z "${declared}" ]; then
            echo "::error::${pkg} is not a dependency of language-server/package.json - this workflow is watching nothing"
            exit 1
          fi
          # See the note on the engine lookup below: the last whitespace-separated
          # field reads both of npm's output shapes.
          resolved="$(npm view "${pkg}@${declared}" version 2>/dev/null | tail -1 | tr -d "'\"" | awk '{print $NF}')"
          latest="$(npm view "${pkg}" version 2>/dev/null | tr -d "'\"" | awk '{print $NF}')"
          if [ -z "${resolved}" ]; then
            echo "::error::${pkg}@${declared} resolves to nothing on the registry - an install here is broken"
            exit 1
          fi
          locked="$(node -p "require('./language-server/package-lock.json').packages['node_modules/${pkg}'].version")"
          echo "declared        ${declared}"
          echo "resolves to     ${resolved}"
          echo "lockfile        ${locked}"
          echo "registry latest ${latest}"
          if [ "${resolved}" != "${locked}" ]; then
            echo "::error::the declared ${declared} resolves to ${resolved} but the lockfile installs ${locked} - what CI handshakes with is not what the manifest says"
            exit 1
          fi
          if [ "${resolved}" != "${latest}" ]; then
            echo "::warning::${pkg} ${latest} is published, but this package takes ${resolved} - the pin is exact, so no release arrives on its own"
          fi
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Read the engine the pinned server carries
        id: engine
        run: |
          set -euo pipefail
          # carve-lsp records its engine in its own package.json. Nothing
          # downstream ever read it, so how far a Sublime user was from the
          # language was two lookups nobody performed.
          range="$(node -p "const p=require('./language-server/node_modules/@markup-carve/carve-lsp/package.json');(p.dependencies||{})['@markup-carve/carve']||''")"
          if [ -z "${range}" ]; then
            echo "::error::the installed carve-lsp declares no @markup-carve/carve dependency, so the engine behind this client cannot be identified"
            exit 1
          fi
          # `npm view <pkg>@<range> version` prints ONE bare version when the
          # range matches a single release, and `<pkg>@<v> '<v>'` lines when it
          # matches several. Taking the last WHITESPACE-SEPARATED FIELD reads
          # both; `tail -1` alone concatenates the spec onto the version the
          # moment a second matching release exists.
          engine="$(npm view "@markup-carve/carve@${range}" version 2>/dev/null | tail -1 | tr -d "'\"" | awk '{print $NF}')"
          if [ -z "${engine}" ]; then
            echo "::error::the server's engine range ${range} resolves to nothing on the registry"
            exit 1
          fi
          echo "the pinned server carries engine range ${range}, resolving to ${engine}"
          echo "engine=${engine}" >> "${GITHUB_OUTPUT}"

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-js
          path: carve-js
          fetch-depth: 0

      - name: Compare that engine against carve-js main
        run: |
          set -euo pipefail
          engine='${{ steps.engine.outputs.engine }}'
          tag=""
          for candidate in "${engine}" "v${engine}"; do
            if git -C carve-js rev-parse "${candidate}" >/dev/null 2>&1; then
              tag="${candidate}"
              break
            fi
          done
          if [ -z "${tag}" ]; then
            echo "::warning::carve-js has no tag for ${engine}, so the engine behind this client cannot be located in the source"
            exit 0
          fi
          behind="$(git -C carve-js rev-list --count "${tag}..origin/main")"
          echo "engine ${engine} is carve-js ${tag} ($(git -C carve-js log -1 --format=%s "${tag}"))"
          echo "carve-js main is ${behind} commit(s) ahead of it"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::a Sublime user on this pin is ${behind} carve-js commit(s) behind the language - two pins deep, and only a carve-js release closes the second one"
          fi

  latest-server:
    name: The server this package would take next still speaks to it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the LATEST carve-lsp
        working-directory: language-server
        run: npm install --no-audit --no-fund "@markup-carve/carve-lsp@latest"

      - name: Handshake with the latest server over stdio
        run: |
          # The same exchange ci.yml runs against the pinned server. Bumping the
          # pin is otherwise a leap: the client would find out that a newer
          # server no longer publishes what it expects only after the bump
          # shipped, which for a Sublime package means after a user installed it.
          python - <<'PY'
          import json
          import subprocess
          import sys
          import time

          def frame(message):
              body = json.dumps(message).encode()
              return b'Content-Length: %d\r\n\r\n' % len(body) + body

          server = subprocess.Popen(
              ['node', 'language-server/node_modules/@markup-carve/carve-lsp/dist/server.js', '--stdio'],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          server.stdin.write(frame({
              'jsonrpc': '2.0', 'id': 1, 'method': 'initialize',
              'params': {'processId': None, 'rootUri': None, 'capabilities': {}},
          }))
          server.stdin.flush()
          time.sleep(2)
          server.stdin.write(frame({'jsonrpc': '2.0', 'method': 'initialized', 'params': {}}))
          server.stdin.write(frame({
              'jsonrpc': '2.0', 'method': 'textDocument/didOpen',
              'params': {'textDocument': {
                  'uri': 'file:///ci.crv', 'languageId': 'carve', 'version': 1,
                  # `**bold**` is a Markdown habit Carve does not share, so the
                  # server must report it.
                  'text': '# Title\n\n**markdown bold**\n',
              }},
          }))
          server.stdin.flush()
          time.sleep(3)
          server.terminate()
          out, err = server.communicate(timeout=10)
          text = out.decode('utf-8', 'replace')

          problems = []
          if '"capabilities"' not in text:
              problems.append('no capabilities in the initialize response')
          if 'publishDiagnostics' not in text:
              problems.append('no diagnostics published')
          if 'markdown-strong-double-star' not in text:
              problems.append('expected diagnostic for ** not reported')
          if problems:
              print('FAILED:', '; '.join(problems))
              print('stderr:', err.decode('utf-8', 'replace')[:2000])
              sys.exit(1)
          print('latest server handshake ok, diagnostics published')
          PY
