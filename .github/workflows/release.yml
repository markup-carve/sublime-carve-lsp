name: Release

# The tag is created by THIS workflow, after the gates pass and after a human
# approves. Package Control installs this package from its git tags, so the tag
# is the first irreversible act in a release here: once it is pushed, Package
# Control can serve it, with no approval anywhere in that path. Deriving the run
# from a tag push would run the gates after that act instead of before it.
#
# A release of this repository consists of the tag plus the GitHub release.
# There is no registry to push to: the Package Control channel reads the tag.
#
# The notes are published in this same run rather than by a second workflow
# listening for the tag: a ref created with github.token does not trigger other
# workflows, so a tag-triggered job would never fire.
#
# Every job declares timeout-minutes, so a hung step fails in minutes instead
# of inheriting GitHub's 360-minute default.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v (e.g. 0.1.4)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  guard:
    name: The tag is free and the changelog agrees
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag does not exist yet
        run: |
          VER="${{ inputs.version }}"
          if git rev-parse -q --verify "refs/tags/${VER}" >/dev/null; then
            echo "::error::Tag ${VER} already exists. Supersede it with a new version."
            exit 1
          fi

      # This package carries no version manifest of its own. sublime-package.json
      # holds a settings schema, dependencies.json names Package Control
      # dependencies, and language-server/package.json pins the carve-lsp server
      # (a different version line, deliberately not tied to this package's).
      # So the changelog section is the only version surface here. If a package
      # version field is ever added, gate on it too.
      - name: The changelog describes this version
        run: |
          VER="${{ inputs.version }}"
          if ! grep -qE "^## \[?${VER//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VER."
            exit 1
          fi

      - name: The changelog section is not empty
        run: |
          VER="${{ inputs.version }}"
          body="$(awk -v v="^## \\\\[?${VER//./\\.}\\\\]?" '
            $0 ~ v {inside=1; next}
            inside && /^## / {exit}
            inside {print}' CHANGELOG.md | tr -d '[:space:]')"
          if [ -z "$body" ]; then
            echo "::error::the CHANGELOG.md section for $VER is empty."
            exit 1
          fi

      # The pinned server is what users actually get, and an unpinned range
      # would make two installs of the same tag behave differently.
      - name: The language server is pinned to an exact version
        run: |
          python3 - <<'PY'
          import json, re, sys
          deps = json.load(open("language-server/package.json", encoding="utf-8"))
          pin = (deps.get("dependencies") or {}).get("@markup-carve/carve-lsp")
          if not pin:
              sys.exit("::error::language-server/package.json does not depend on the carve-lsp server")
          if not re.fullmatch(r"\d+\.\d+\.\d+", pin):
              sys.exit(f"::error::carve-lsp is pinned as {pin!r}, not an exact version;"
                       " two installs of this tag could resolve differently")
          print(f"ok   carve-lsp pinned at {pin}")
          PY

  release-notes:
    name: A release draft for this version exists and has notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `write`, not `read`: a DRAFT release is invisible to a caller without
      # push access, so under `contents: read` the listing comes back empty and
      # this reports "no draft" for a draft sitting right there with notes in it.
      contents: write
    steps:
      # Listed rather than addressed by tag: a draft's tag is not a git ref, so
      # `gh release view <tag>` can match nothing, change nothing and exit 0.
      - name: The draft exists and has notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          release="$(gh api "repos/$REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$VER\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release draft for $VER. Write the notes first."
            echo "::error::if a draft DOES exist, this job could not see it - check that it still declares contents: write"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          if [ -z "$body" ]; then
            echo "::error::the release for $VER has no notes."
            exit 1
          fi
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

  tests:
    name: Package files validate and the pinned server speaks LSP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Validate JSON (comments allowed in .sublime-settings)
        run: |
          python - <<'PY'
          import glob, json, re, sys
          paths = sorted(
              glob.glob('*.json')
              + glob.glob('*.sublime-settings')
              + glob.glob('*.sublime-menu')
              + glob.glob('*.sublime-commands')
              + glob.glob('language-server/package.json')
          )
          failed = False
          for path in paths:
              raw = open(path, encoding='utf-8').read()
              # Sublime accepts // comments and trailing commas; strip both.
              stripped = re.sub(r'^\s*//.*$', '', raw, flags=re.M)
              stripped = re.sub(r',(\s*[}\]])', r'\1', stripped)
              try:
                  json.loads(stripped)
                  print('ok  ', path)
              except Exception as error:
                  print('FAIL', path, error)
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Byte-compile the plugin
        # The plugin imports LSP/lsp_utils, which only exist inside Sublime, so
        # compile it rather than importing it.
        run: python -m py_compile plugin.py

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install the pinned carve-lsp
        working-directory: language-server
        run: npm install --no-audit --no-fund

      - name: The pinned server binary is present and starts
        run: |
          server=language-server/node_modules/@markup-carve/carve-lsp/dist/server.js
          test -s "$server" || { echo "::error::$server is missing from the pinned install"; exit 1; }
          node --check "$server"
          echo "ok   $server"

  tag:
    name: Create the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guard, release-notes, tests]
    # THE APPROVAL GATE, and the only one: GitHub prompts once per gated job,
    # so a second `environment:` would ask twice for one decision. `needs:`
    # makes this unreachable until every gate above passes.
    environment: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Push the tag
        run: |
          VER="${{ inputs.version }}"
          # Re-checked under the approval: main can move while a run waits for a
          # reviewer, and the gates measured the commit that was current then.
          if ! grep -qE "^## \[?${VER//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no longer has a section for $VER. main moved" \
                 "while this run waited for approval. Re-run the workflow."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VER}" >/dev/null; then
            echo "::error::Tag ${VER} appeared while this run waited. Stopping."
            exit 1
          fi
          git tag "${VER}" "$GITHUB_SHA"
          git push origin "refs/tags/${VER}"
          echo "tagged ${VER} at $GITHUB_SHA"

  publish:
    name: Publish the release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tag]
    # No `environment:` here: the decision was spent on the tag, and
    # `needs: [tag]` already makes this unreachable without it.
    permissions:
      contents: write
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          id="$(gh api "repos/$REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$VER\" and .draft)] | first | .id // empty")"
          if [ -z "$id" ]; then
            echo "No draft release for $VER; nothing to publish."
            exit 0
          fi
          # `tag_name` goes with every PATCH of a release: omit it on a draft and
          # GitHub replaces the tag with a generated `untagged-*` placeholder.
          # `-F` for draft, so it is sent as a boolean - the string "false" is
          # truthy and publishes anyway.
          gh api "repos/$REPO/releases/$id" -X PATCH \
            -f tag_name="$VER" -F draft=false --jq '"published \(.tag_name)"'
          gh api "repos/$REPO/releases/$id" --jq '"draft=\(.draft) tag=\(.tag_name)"'
